{% extends 'base.html' %}{% block content %}<section class="pagehead"><div><p class="eyebrow">MULTI-CHANNEL INTAKE</p><h1>New victim/complainant check-in</h1><p>Submit a text response and optional WAV sample. The engine creates a dynamic engineering risk signal and routes it to human review.</p></div></section><form class="panel form" method="post" action="/checkin" enctype="multipart/form-data"><label>Case<select name="case_id">{% for c in cases %}<option value="{{c.id}}">{{c.id}} — {{c.name}} · {{c.district}}</option>{% endfor %}</select></label><div class="two"><label>Channel<select name="channel"><option>Web/Chat</option><option>IVRS</option><option>SMS</option><option>WhatsApp</option><option>Helpline 14566</option></select></label><label>Language<select name="language">{% for l in languages %}<option>{{l}}</option>{% endfor %}</select></label></div><label>Response / check-in text<textarea name="text" id="text" required placeholder="Example: I feel increasingly worried about the next hearing and I am not sleeping well."></textarea></label><div class="demoBtns"><button type="button" class="btn" onclick="document.getElementById('text').value='I am scared about the hearing and do not feel safe. The threats are making it hard to function.'">Load High-Risk Demo</button><button type="button" class="btn" onclick="document.getElementById('text').value='I feel safe today and things are manageable. I have support from my family.'">Load Stable Demo</button></div><div class="two"><label>Engagement <input type="number" name="engagement" min="0" max="100" value="55"><small>0–100 channel engagement index</small></label><label>Response latency <input type="number" name="latency" min="0" max="300" value="20"><small>minutes from prompt to response</small></label></div><label class="check"><input type="checkbox" name="duress"> Simulate silent duress signal (#) <small>For demonstration only; triggers priority human review.</small></label><label>Optional WAV voice sample<input type="file" name="audio" accept="audio/wav,.wav"><small>16-bit mono WAV gives basic RMS/ZCR statistics. No biometric identity inference.</small></label><button class="btn primary" type="submit">Analyse & route to human review →</button></form>{% endblock %}
